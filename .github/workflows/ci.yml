name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on any branch: gh workflow run CI --ref <branch>
  workflow_dispatch:

# SR-028: least privilege for the workflow token.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # SR-028: actions pinned by commit SHA (Dependabot keeps them updated).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      # gofmt, go vet and go test (including the startup and memory budget, NFR-013).
      - run: go run ./scripts/check
      - run: go build -trimpath ./cmd/hilvan
      - run: go run ./cmd/hilvan --version
      # SR-026: known vulnerabilities in the module graph and the standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        if: matrix.os == 'ubuntu-latest'
