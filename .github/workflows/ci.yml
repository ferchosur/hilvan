name: CI

on:
  push:
    branches: [main]
  pull_request:

# SR-028: least privilege for the workflow token.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # SR-028: actions pinned by commit SHA (Dependabot keeps them updated).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # SR-026: no install scripts from dependencies.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node dist/cli/index.js --version

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
      # Registry signature check; warn-only because npm < 10 rejects signatures made with
      # keys rotated in 2025 (EEXPIREDSIGNATUREKEY) even when they were valid at publish time.
      - run: npm audit signatures
        continue-on-error: true
