name: Release

# SR-029: binaries built in CI, sha256 sums and build provenance attestations.
# Pushing a tag vX.Y.Z publishes a release. A manual run builds and checks
# the artifacts without publishing: gh workflow run Release --ref <branch>

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# SR-028: least privilege. Only the publish job can write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./scripts/check

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Version (tag without v, or a dev version for manual runs)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/ferchosur/hilvan/internal/version.Version=${VERSION}" \
            -o "dist/hilvan-${VERSION}-${GOOS}-${GOARCH}${ext}" ./cmd/hilvan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hilvan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hilvan-*
          path: dist
          merge-multiple: true
      - name: Sums
        working-directory: dist
        run: sha256sum hilvan-* > SHA256SUMS
      # Provenance from GitHub (replaces the npm provenance of SR-029).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/hilvan-*"
      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/hilvan-* dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Hilvan ${GITHUB_REF_NAME#v}"
